<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284C7" />
      <stop offset="50%" stop-color="#0369A1" />
      <stop offset="100%" stop-color="#0C4A6E" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="50%" stop-color="#BAE6FD" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#0C4A6E" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Circular Outer Frame with Sacred Light Blue Ring -->
  <circle cx="50" cy="50" r="46" fill="url(#blueGrad)" stroke="#BAE6FD" stroke-width="2.5" />
  <circle cx="50" cy="50" r="41" fill="none" stroke="#E0F2FE" stroke-width="1" stroke-dasharray="2 3" opacity="0.8" />

  <!-- Lotus Base -->
  <g fill="#F0F9FF" filter="url(#shadow)">
    <!-- Central lotus petal -->
    <path d="M50 48 C46 56 42 66 50 72 C58 66 54 56 50 48 Z" />
    <!-- Left petal -->
    <path d="M50 64 C42 61 32 64 34 72 C40 75 48 70 50 64 Z" fill="#E0F2FE" />
    <!-- Right petal -->
    <path d="M50 64 C58 61 68 64 66 72 C60 75 52 70 50 64 Z" fill="#E0F2FE" />
  </g>

  <!-- Trishul & Diya Flame Symbolizing Shakti & Seva -->
  <g stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none" filter="url(#shadow)">
    <!-- Center spear -->
    <line x1="50" y1="20" x2="50" y2="55" stroke-width="2.5" stroke="#FFFFFF" />
    <path d="M47 22 L50 17 L53 22 Z" fill="#BAE6FD" stroke="none" />
    
    <!-- Curved prongs -->
    <path d="M38 27 C38 40 46 44 50 45 C54 44 62 40 62 27" stroke-width="2.5" stroke="#E0F2FE" />
    <circle cx="38" cy="26" r="1.5" fill="#38BDF8" />
    <circle cx="62" cy="26" r="1.5" fill="#38BDF8" />
    
    <!-- Sacred Tilak / Bindu -->
    <circle cx="50" cy="33" r="2.5" fill="#38BDF8" stroke="#FFFFFF" stroke-width="0.8" />
  </g>

  <!-- Rays of Light -->
  <circle cx="50" cy="50" r="3" fill="#FFFFFF" opacity="0.9" />
</svg>
