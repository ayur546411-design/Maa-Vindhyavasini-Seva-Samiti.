<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B" />
      <stop offset="50%" stop-color="#FDE68A" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>
    <linearGradient id="maroonGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9B1D39" />
      <stop offset="100%" stop-color="#58141E" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#380A11" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Circular Outer Frame with Sacred Petals -->
  <circle cx="50" cy="50" r="46" fill="url(#maroonGrad)" stroke="url(#goldGrad)" stroke-width="2.5" />
  <circle cx="50" cy="50" r="41" fill="none" stroke="#FDE68A" stroke-width="1" stroke-dasharray="2 3" opacity="0.8" />

  <!-- Lotus Base -->
  <g fill="url(#goldGrad)" filter="url(#shadow)">
    <!-- Central lotus petal -->
    <path d="M50 48 C46 56 42 66 50 72 C58 66 54 56 50 48 Z" />
    <!-- Left petal -->
    <path d="M50 64 C42 61 32 64 34 72 C40 75 48 70 50 64 Z" />
    <!-- Right petal -->
    <path d="M50 64 C58 61 68 64 66 72 C60 75 52 70 50 64 Z" />
  </g>

  <!-- Trishul & Diya Flame Symbolizing Shakti & Seva -->
  <g stroke="url(#goldGrad)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none" filter="url(#shadow)">
    <!-- Center spear -->
    <line x1="50" y1="20" x2="50" y2="55" stroke-width="2.5" stroke="#FFF8ED" />
    <path d="M47 22 L50 17 L53 22 Z" fill="#FDE68A" stroke="none" />
    
    <!-- Curved prongs -->
    <path d="M38 27 C38 40 46 44 50 45 C54 44 62 40 62 27" stroke-width="2.5" stroke="#FDE68A" />
    <circle cx="38" cy="26" r="1.5" fill="#F59E0B" />
    <circle cx="62" cy="26" r="1.5" fill="#F59E0B" />
    
    <!-- Sacred Tilak / Bindu -->
    <circle cx="50" cy="33" r="2.5" fill="#EF4444" stroke="#FDE68A" stroke-width="0.8" />
  </g>

  <!-- Rays of Light -->
  <circle cx="50" cy="50" r="3" fill="#FFF8ED" opacity="0.9" />
</svg>
